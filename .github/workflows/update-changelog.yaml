name: Update Changelog

on:
  push:
    branches: ["master"]
    paths-ignore:
      - CHANGELOG.md
  workflow_dispatch:

permissions:
  contents: read # Set default read-only permissions

# Every run updates the same docs/update-changelog branch, so runs share one group whatever ref started them.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write # For committing changelog
      pull-requests: write # For creating PR
    steps:
      - name: Harden the Runner (Step Security)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate Changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config: cliff.toml
          args: --verbose

      - name: Create Pull Request for Changelog
        id: create_pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: docs/update-changelog
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          sign-commits: true
          title: "docs(changelog): update changelog"
          commit-message: "docs(changelog): update changelog"
          body: "Automated changelog update"
          delete-branch: true

      - name: Merge the changelog pull request
        if: "${{ steps.create_pr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST_NUMBER: ${{ steps.create_pr.outputs.pull-request-number }}
          HEAD_SHA: ${{ steps.create_pr.outputs.pull-request-head-sha }}
        run: |
          # GitHub refuses auto-merge for a pull request that is already mergeable, so merge it directly then.
          # Both merges are pinned to the commit created above, so a later push is never merged unseen.
          if ! gh pr merge --auto --squash --match-head-commit "${HEAD_SHA}" "${PULL_REQUEST_NUMBER}"; then
            echo "Auto-merge is unavailable; merging the clean pull request directly"
            gh pr merge --squash --match-head-commit "${HEAD_SHA}" "${PULL_REQUEST_NUMBER}"
          fi
