# Runs one speed test with the settings in config.yaml:
#
#   docker compose run --rm speedtest
services:
  speedtest:
    image: ${SPEEDTEST_GO_IMAGE:-nickfedor/speedtest-go:latest@sha256:5ea3671320168d5b30cac98cebca05b08afafc3aab71dbef6428c0fbfc311508}
    environment:
      SPEEDTEST_GO_CONFIG: /config.yaml
    volumes:
      - ./config.yaml:/config.yaml:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
